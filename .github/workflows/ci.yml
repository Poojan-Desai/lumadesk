name: Native macOS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build native app
        run: swift build -c release --product LumaDesk
      - name: Run XCTest suite
        run: swift test
      - name: Run standalone integration checks
        run: swift run LumaDeskChecks
      - name: Build retrieval benchmark
        run: swift build --product LumaBenchmark
      - name: Validate benchmark CLI and unavailable-model behavior
        run: python3 scripts/check-benchmark.py
      - name: Record local-model retrieval smoke report
        run: swift run LumaBenchmark --repetitions 2 --warmups 1 --output benchmark-report.json
      - name: Upload retrieval smoke report
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-smoke-report
          path: benchmark-report.json
